name: repo-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for forbidden files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env$|\.env\.production$|.*\.pem$|.*\.p12$|.*\.pfx$|credentials\.json$|service-account.*\.json$)'
          if git ls-files | grep -Ei "$forbidden"; then
            echo "Forbidden secret/credential file is tracked."
            exit 1
          fi
